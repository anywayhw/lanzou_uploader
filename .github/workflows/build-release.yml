name: Build and Release

# 仅在推送版本标签（形如 v1.2.0）时触发：自动构建 Windows exe 与 macOS app，
# 并通过 GitHub CLI (gh) 把两个产物发布到同名 Release。
on:
  push:
    tags:
      - 'v*'

# 发布 Release 需要向仓库写入内容的权限
permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable (onefile)
        # Windows 端自动更新需要单个 .exe：--onefile。
        # 资源目录整体打包，运行时由 _load_icon 从 sys._MEIPASS/assets 读取图标。
        run: pyinstaller --windowed --onefile --name LanzouUploader --icon assets/appicon.ico --add-data "assets;assets" lanzou_uploader.py

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/LanzouUploader.exe

  build-macos:
    name: Build macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build app (onedir)
        # macOS 端自动更新需要 .app 目录：--onedir。
        run: pyinstaller --windowed --onedir --name LanzouUploader --icon assets/appicon.icns --add-data "assets:assets" lanzou_uploader.py

      - name: Package app as zip
        run: ditto -c -k --keepParent dist/LanzouUploader.app LanzouUploader.app.zip

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: LanzouUploader.app.zip

  release:
    name: Publish release with gh CLI
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "LanzouUploader ${GITHUB_REF_NAME}" \
            --notes "自动构建发布的跨平台版本：
          - Windows：LanzouUploader.exe（单文件，下载后替换自身即可更新）
          - macOS：LanzouUploader.app.zip（未签名，首次运行需右键打开或 xattr -dr）" \
            "artifacts/windows-exe/LanzouUploader.exe" \
            "artifacts/macos-app/LanzouUploader.app.zip"
